<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#1a103c"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle1 {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
    }
    @keyframes floatParticle2 {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      50% { transform: translateY(12px) translateX(-8px); opacity: 0.9; }
    }
    @keyframes eventPing {
      0% { r: 4px; opacity: 1; }
      100% { r: 16px; opacity: 0; }
    }
    .flow-path {
      stroke-dasharray: 20 10;
      animation: flowLine 15s linear infinite;
    }
    .p1 { animation: floatParticle1 6s ease-in-out infinite; }
    .p2 { animation: floatParticle2 5s ease-in-out infinite; }
    .ping-circle {
      animation: eventPing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12"/>

  <!-- Subtle Dynamic Tech Grid / Network Background -->
  <g opacity="0.15">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#6366f1" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#6366f1" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#6366f1" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#6366f1" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#6366f1" stroke-width="1"/>
    
    <line x1="150" y1="0" x2="150" y2="360" stroke="#6366f1" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="360" stroke="#6366f1" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="360" stroke="#6366f1" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="360" stroke="#6366f1" stroke-width="1"/>
    <line x1="750" y1="0" x2="750" y2="360" stroke="#6366f1" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="360" stroke="#6366f1" stroke-width="1"/>
    <line x1="1050" y1="0" x2="1050" y2="360" stroke="#6366f1" stroke-width="1"/>
  </g>

  <!-- Dynamic Glowing Radial Orbs in Background -->
  <circle cx="200" cy="90" r="140" fill="url(#glowPulse)" class="p1" />
  <circle cx="1020" cy="270" r="160" fill="url(#glowPulse)" class="p2" />

  <!-- Animated Webhook / Event Flow Lines (Behind text) -->
  <path d="M 50,180 Q 300,50 600,180 T 1150,180" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" class="flow-path"/>
  <path d="M 80,260 Q 400,340 700,200 T 1120,100" fill="none" stroke="url(#lineGrad)" stroke-width="1.5" class="flow-path" style="animation-duration: 20s;"/>

  <!-- Dynamic Event Signal Nodes with Ping Animation -->
  <g transform="translate(180, 125)">
    <circle cx="0" cy="0" r="12" fill="#6366f1" opacity="0.3" class="ping-circle" />
    <circle cx="0" cy="0" r="5" fill="#38bdf8" />
  </g>
  <g transform="translate(1020, 140)">
    <circle cx="0" cy="0" r="12" fill="#ec4899" opacity="0.3" class="ping-circle" style="animation-delay: 1.2s;" />
    <circle cx="0" cy="0" r="5" fill="#ec4899" />
  </g>
  <g transform="translate(600, 180)">
    <circle cx="0" cy="0" r="16" fill="#a855f7" opacity="0.3" class="ping-circle" style="animation-delay: 0.6s;" />
    <circle cx="0" cy="0" r="6" fill="#c084fc" />
  </g>

  <!-- Foreground Content: Badge Tag -->
  <g transform="translate(600, 68)">
    <rect x="-140" y="-15" width="280" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity="0.95"/>
    <text x="0" y="5" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">⚡ CURATED AWESOME LIST</text>
  </g>

  <!-- Foreground Main Title with Gradient Fill -->
  <text x="600" y="148" text-anchor="middle" font-size="44" font-weight="800" letter-spacing="-0.5" fill="url(#primaryGrad)" filter="url(#glow)">
    Awesome Webhooks &amp; Event Systems
  </text>
  <!-- Non-blurred crisp text overlay -->
  <text x="600" y="148" text-anchor="middle" font-size="44" font-weight="800" letter-spacing="-0.5" fill="#ffffff">
    Awesome Webhooks &amp; Event Systems
  </text>

  <!-- Foreground Subtitle -->
  <text x="600" y="196" text-anchor="middle" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Production Webhooks-as-a-Service • Event Gateways • Inbound/Outbound Routing • Local Debugging
  </text>

  <!-- Feature Tags / Pills at Bottom -->
  <g transform="translate(600, 275)">
    <!-- Pill 1: Webhook Delivery -->
    <g transform="translate(-360, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle">🚀 Reliable Delivery</text>
    </g>

    <!-- Pill 2: HMAC Security -->
    <g transform="translate(-180, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle">🔐 HMAC &amp; Security</text>
    </g>

    <!-- Pill 3: Fanout & Queueing -->
    <g transform="translate(0, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle">🔄 Fanout &amp; Retries</text>
    </g>

    <!-- Pill 4: Open Source -->
    <g transform="translate(180, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle">⭐ Open Source &amp; SaaS</text>
    </g>

    <!-- Pill 5: Local Testing -->
    <g transform="translate(360, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle">🛠️ Local Debugging</text>
    </g>
  </g>
</svg>
